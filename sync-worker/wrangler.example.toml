# Copy to wrangler.toml and fill in. The D1 database is shared with the Pages project.
name = "discord-archive-sync"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
# every minute: new messages and threads; every 2 minutes: roles and member profiles (src/members.ts)
crons = ["*/1 * * * *", "*/2 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "discord-archive-db"
database_id = "<your D1 database id>"

# Realtime sync (optional, REALTIME_GATEWAY = "true"): a Durable Object keeps a Discord gateway connection open
[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "DiscordGateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiscordGateway"]

[vars]
DISCORD_GUILD_ID = "<your server id>"
# REALTIME_GATEWAY = "true"   # see README "Realtime sync" (with a user token this is a self-bot)
# GUILD_OWNER_ID = ""
# PRIORITY_CHANNEL_IDS = "id1,id2"

# Secret (not in this file):  npx wrangler secret put DISCORD_TOKEN
