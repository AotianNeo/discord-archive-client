    <!-- discord-archive-client: dismiss promotional/onboarding popups that open on their own. Only dialogs are touched
         (a blanket [aria-label="Close"] click also shut forum post sidebars), never ones that appear right after user input. -->
    <script>
        (() => {
            let attempts = 0, lastInput = 0;
            const firstSeen = new WeakMap();
            for (const type of ['pointerdown', 'keydown']) document.addEventListener(type, () => { lastInput = Date.now(); }, true);
            const spontaneous = (el) => {
                if (!firstSeen.has(el)) firstSeen.set(el, Date.now());
                return firstSeen.get(el) - lastInput > 1500;
            };
            const timer = setInterval(() => {
                if (++attempts > 60) return clearInterval(timer);
                for (const button of document.querySelectorAll('button')) {
                    if (/^(No, thanks|Got It)$/i.test((button.innerText || '').trim()) && spontaneous(button)) button.click();
                }
                for (const dialog of document.querySelectorAll('[role="dialog"]')) {
                    const close = dialog.querySelector('button[aria-label="Close"]');
                    if (close && spontaneous(dialog)) close.click();
                }
            }, 500);
        })();
    </script>
